import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets

// Flutter passes --dart-define and --dart-define-from-file to Gradle as
// comma-separated Base64 KEY=value entries. Validate the values actually compiled.
ext.validateSupabaseDartDefines = { String encoded ->
    def values = [:]
    try {
        if (encoded) {
            encoded.split(',').each { entry ->
                def value = new String(Base64.decoder.decode(entry), StandardCharsets.UTF_8)
                int separator = value.indexOf('=')
                if (separator < 1) throw new IllegalArgumentException()
                // Ambiguous project definitions must never produce a release artifact.
                def name = value.substring(0, separator)
                if (name in ['SUPABASE_URL', 'SUPABASE_PUBLISHABLE_KEY'] && values.containsKey(name)) throw new IllegalArgumentException()
                values[name] = value.substring(separator + 1)
            }
        }
        def url = new URI(values['SUPABASE_URL'] ?: '')
        def key = values['SUPABASE_PUBLISHABLE_KEY'] ?: ''
        def validUrl = url.scheme == 'https' && url.host && !url.rawUserInfo &&
            (!url.rawPath || url.rawPath == '/') && url.rawQuery == null && url.rawFragment == null
        def publicKey = key.startsWith('sb_publishable_') && key.length() > 20
        if (!publicKey) {
            def parts = key.split('\\.', -1)
            if (parts.length == 3) {
                def payload = new String(Base64.urlDecoder.decode(parts[1]), StandardCharsets.UTF_8)
                publicKey = new JsonSlurper().parseText(payload)?.role == 'anon'
            }
        }
        if (validUrl && publicKey) return
    } catch (Exception ignored) {
        // Report only the remedy; never echo a supplied key or encoded defines.
    }
    throw new GradleException('Supabase client configuration is missing or invalid. Build the user app with --dart-define-from-file=config/production.json (or valid SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY defines). See docs/ANDROID_RELEASE_BUILD.md. Service-role and secret keys must never be used in the app.')
}
